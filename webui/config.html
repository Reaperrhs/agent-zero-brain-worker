<html>
<head>
    <title>Brain-Worker Settings</title>
    <script type="module">
        import { store } from "/components/plugins/plugin-settings-store.js";
    </script>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div>
                <div class="section-title">Brain-Worker Settings</div>
                <div class="section-description">
                    Configure the worker model for subordinate agents and the orchestrator enforcement behavior.
                </div>

                <!-- Worker Chat Model -->
                <div class="section-subtitle">Worker Chat Model</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Provider</div>
                        <div class="field-description">
                            LLM provider ID for the worker chat model.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_chat_model.provider" placeholder="zai_coding" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Model name</div>
                        <div class="field-description">
                            Provider-specific model identifier.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_chat_model.name" placeholder="glm-5.2" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">API base URL</div>
                        <div class="field-description">
                            Custom endpoint for the worker model provider.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_chat_model.api_base" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context length</div>
                        <div class="field-description">
                            Maximum context window for the worker model.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" x-model.number="config.worker_chat_model.ctx_length" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context history ratio</div>
                        <div class="field-description">
                            Fraction of context (0–1) retained as conversation history.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" max="1" step="0.1" x-model.number="config.worker_chat_model.ctx_history" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Supports vision</div>
                        <div class="field-description">
                            Enable when the worker model can accept image input.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.worker_chat_model.vision" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Requests per minute limit</div>
                        <div class="field-description">
                            Set to 0 to disable request throttling.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" x-model.number="config.worker_chat_model.rl_requests" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Input tokens per minute limit</div>
                        <div class="field-description">
                            Set to 0 to disable input token throttling.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" x-model.number="config.worker_chat_model.rl_input" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Output tokens per minute limit</div>
                        <div class="field-description">
                            Set to 0 to disable output token throttling.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" x-model.number="config.worker_chat_model.rl_output" />
                    </div>
                </div>

                <!-- Worker Utility Model -->
                <div class="section-subtitle">Worker Utility Model</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Provider</div>
                        <div class="field-description">
                            LLM provider ID for the worker utility model.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_utility_model.provider" placeholder="other" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Model name</div>
                        <div class="field-description">
                            Provider-specific model identifier.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_utility_model.name" placeholder="free-stack-Utility" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">API base URL</div>
                        <div class="field-description">
                            Custom endpoint for the utility model provider.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.worker_utility_model.api_base" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context length</div>
                        <div class="field-description">
                            Maximum context window for the utility model.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" x-model.number="config.worker_utility_model.ctx_length" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Context input ratio</div>
                        <div class="field-description">
                            Fraction of context (0–1) used for input.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="0" max="1" step="0.1" x-model.number="config.worker_utility_model.ctx_input" />
                    </div>
                </div>

                <!-- Orchestrator Enforce -->
                <div class="section-subtitle">Orchestrator</div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enforce orchestrator-only mode</div>
                        <div class="field-description">
                            When enabled, Agent 0 is forced to act as orchestrator only and delegate all execution to worker subordinates.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.orchestrator_enforce" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>
</html>
